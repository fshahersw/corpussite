<!doctype html>
<html lang="en">

  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">

<body>
  <a class="skip-link" href="#main">Skip to collection</a>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#overview" aria-label="Legal Archive home"><span class="brand-mark" aria-hidden="true">LA</span><span>Legal Archive<small>YOUR RESEARCH LIBRARY</small></span></a>
      <p class="nav-label">Research</p>
      <nav aria-label="Main navigation" class="hub-nav">
        <a href="#overview" data-hub="places"><span aria-hidden="true">◍</span> States &amp; counties</a>
        <a href="#regulations" data-hub="law"><span aria-hidden="true">§</span> Federal law &amp; agencies</a>
        <a href="#judges" data-hub="litigation"><span aria-hidden="true">⚖</span> Courts &amp; litigation</a>
      </nav>
      <div class="sidebar-bottom"><span class="local-label"><i aria-hidden="true"></i> Your local library</span><p>Read, explore, and return to the original whenever you need it.</p></div>

      <header class="topbar"><div class="breadcrumb">Library <span aria-hidden="true">/</span> <span id="breadcrumb-current">Home</span></div><div class="topbar-right"><span class="snapshot-label" id="snapshot-label"></span><button class="button button-small" id="refresh-button" type="button" aria-label="Refresh collection data">↻ <span>Refresh</span></button></div></header>

      <main id="main" tabindex="-1"></main>
      <footer class="page-footer"><span>Legal Archive · Personal research library</span></footer>
    </div>
  </div>
  <dialog id="record-dialog" aria-labelledby="record-title">
    <div class="dialog-top"><span class="eyebrow">Document reader</span><button class="icon-button" id="close-record" type="button" aria-label="Close record details">×</button></div>
    <div id="record-body"></div>
  </dialog>
  <div id="announcement" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
  <noscript><p class="noscript">This directory needs JavaScript and its local archive server. Your saved files are unchanged.</p></noscript>
